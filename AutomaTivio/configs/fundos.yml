# ============================================================================
# Cadastro de fundos
# ----------------------------------------------------------------------------
# CNPJ, nome Quantum, benchmark, cota inicial e data de início vêm da aba
# DePara da dados_mensais.xlsx — não se repetem aqui. Este arquivo guarda só o
# que a planilha não tem: a chave usada nos materiais, o vínculo com a DePara,
# o logo, e as regras de exibição.
#
# `carteira`  = valor exato da coluna Carteira na DePara.
# `busca`     = palavras-chave usadas quando `carteira` não casa (a planilha
#               muda o sufixo "- Expandida" de um mês para o outro). O resolvedor
#               tenta `carteira` primeiro e cai para `busca`; o que não resolver
#               aparece na aba "Fundos sem atualização" da conferência.
# `retorno`   = "pct_bench" (padrão, mostra % do benchmark) ou "absoluto"
#               (mostra o retorno do fundo + Alfa).
# ============================================================================

verticais:
  credito_privado:
    rotulo: Crédito Privado
    acento: azul
  credito_estruturado:
    rotulo: Crédito Estruturado
    acento: verde
  investment_solutions:
    rotulo: Investment Solutions
    acento: azul

fundos:

  # ----------------------------------------------------- Crédito Privado (HG)
  banks:
    casas_pct: 2              # "100,59%" e não "101%", como no publicado
    nome: Tivio Banks
    vertical: credito_privado
    carteira: TIVIO BANKS RF CP RL
    razao_social: TIVIO BANKS RENDA FIXA CRÉDITO PRIVADO FIF – RL
    busca: [BANKS]
    logo: Banks
    relatorio: true
    objetivo: >-
      O fundo tem como objetivo identificar oportunidades em ativos de crédito
      high grade (Bancário e Corporativo). Ele busca superar a variação do CDI
      no longo prazo.
    operacional:
      aplicacao: D+0
      resgate: D+0
      aplicacao_minima: R$ 1.000,00
      movimentacao_minima: R$ 1.000,00
    publico: Investidores em geral
    nota_rodape: >-
      *Para solicitações de resgates que representem até 95% (noventa e cinco por cento) do Patrimônio Líquido do FUNDO, o pagamento dos resgates ocorrerá no dia da solicitação do resgate (D+0). Para solicitações de resgates superiores a 95% (noventa e cinco) do Patrimônio Líquido do FUNDO, o pagamento dos resgates ocorrerá no primeiro dia útil após a solicitação dos resgates (D+1).


