# ============================================================================
# Relatório de Gestão — composição por seções
# ----------------------------------------------------------------------------
# Cada seção liga e desliga sem alterar código. A ordem desta lista é a ordem no
# relatório; `pagina` controla a quebra de página.
#
# A composição é POR VERTICAL, e isso não é refinamento: os relatórios de
# Crédito Estruturado publicados são outro produto — 3 páginas, com Alocação
# por Estratégia, sem Principais Emissores, sem Distribuição de Rating e sem a
# tabela de Mercado de Crédito. Aplicar a composição do high grade neles produz
# um relatório que não existe.
#
# `por_fundo` sobrescreve a vertical, para o caso de um fundo só.
# ============================================================================

# ------------------------------------------------- Crédito Privado (padrão)
secoes:
  - {id: objetivo,        pagina: 1, titulo: OBJETIVO DA CARTEIRA}
  - {id: rentabilidade,   pagina: 1, titulo: RENTABILIDADE}
  - {id: emissores,       pagina: 1, titulo: PRINCIPAIS EMISSORES}
  - {id: setores,         pagina: 1, titulo: ALOCAÇÃO DA CARTEIRA DE CRÉDITO POR SETOR}
  - {id: rating,          pagina: 1, titulo: DISTRIBUIÇÃO DE RATING DA CARTEIRA DE CRÉDITO}
  - {id: historico,       pagina: 2, titulo: RENTABILIDADE HISTÓRICA}
  - {id: comentario,      pagina: 2, titulo: "Comentário do Gestor e Análise de Mercado"}
  - {id: mercado_credito, pagina: 3, titulo: MERCADO DE CRÉDITO}
  - {id: caracteristicas, pagina: 4, titulo: CARACTERÍSTICAS GERAIS DO FUNDO}
  - {id: disclaimer,      pagina: 4, titulo: Disclaimer}

por_vertical:
  # ------------------------------------------- Crédito Estruturado (3 páginas)
  # Conferido folha a folha contra os PPTX publicados de ALT 180, ALT 90 e
  # ALT Light. Dois pontos que estavam trocados aqui:
  #
  #   - "ALOCAÇÃO REAL DA CARTEIRA DE CRÉDITO" é o corte por CLASSE (FIDC
  #     Sênior, FIDC Mezanino, Liquidez…) — `estrategia` no código. Estava
  #     apontando para `setores`.
  #   - "ALOCAÇÃO POR ESTRATÉGIA" é o corte por SETOR (Indústria e Comércio,
  #     Consignados, Financeiro…) — `setores`. Estava apontando para
  #     `estrategia`.
  #
  # Os dois títulos trocados davam um relatório com os números certos nos
  # lugares errados, que é pior do que um número faltando: não aparece.
  #
  # A ordem das folhas também é a do original: o comentário do gestor fecha a
  # folha 1 (na faixa escura), e a folha 2 abre com estratégia e colaterais
  # lado a lado, com a rentabilidade histórica embaixo.
  credito_estruturado:
    secoes:
      - {id: objetivo,        pagina: 1, titulo: OBJETIVO DA CARTEIRA}
      - {id: rentabilidade,   pagina: 1, titulo: RENTABILIDADE}
      - {id: estrategia,      pagina: 1, titulo: ALOCAÇÃO REAL DA CARTEIRA DE CRÉDITO}
      - {id: comentario,      pagina: 1, titulo: "Comentário do Gestor e Análise de Mercado"}
      - {id: setores,         pagina: 2, titulo: ALOCAÇÃO POR ESTRATÉGIA}
      - {id: colaterais,      pagina: 2, titulo: COLATERAIS}
      - {id: historico,       pagina: 2, titulo: RENTABILIDADE HISTÓRICA}
      - {id: bench_mais,      pagina: 2, titulo: ""}
      - {id: caracteristicas, pagina: 3, titulo: CARACTERÍSTICAS GERAIS DO FUNDO}
      - {id: disclaimer,      pagina: 3, titulo: Disclaimer}

# ajustes de um fundo só (vencem sobre a vertical)
por_fundo: {}

