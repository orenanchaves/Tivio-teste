# ============================================================================
# De-para API TLDR -> planilha (Base Carteira)
# ----------------------------------------------------------------------------
# A API classifica as posições com nomes próprios (Banco de Varejo, Banco de
# Atacado…); a planilha usa os do relatório publicado (Financeiro…). Este
# arquivo traduz. Foi gerado cruzando as posições da API com a Base Carteira de
# 30/09/2026 (todos os fundos), pegando o valor mais frequente de cada nome.
#
# Nome da API que não estiver aqui passa sem tradução e vira AVISO no log:
# acrescente a linha. Onde a planilha tinha mais de um destino, os comentários
# mostram as contagens — o mapa escolhe o mais frequente e erra o resto.
# `hghy` não existe na API: vale `hghy_padrao` (afeta só HGD30/HYD60).
# ============================================================================
#
# COMO LER — cada bloco é "nome na API: nome na planilha":
#   setor_hg   coluna Setor        (campo `sector` da API)            fundos HG
#   setor_aj   coluna Setor Aj.    (campo `sector` da API)            fundos HY e IS
#   tipo_hg    coluna Tipo         (campo `instrument_class` da API)  fundos HG
#   tipo_aj    coluna Tipo aj.     (campo `instrument_class` da API)  todos os fundos
# hg = relatório de alto grau; aj = coluna "ajustada" usada nos demais.
# ============================================================================
hghy_padrao: HG


