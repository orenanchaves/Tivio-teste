# ============================================================================
# Edição mensal · Central de Materiais Tivio Capital
# ----------------------------------------------------------------------------
# Esta é a ÚNICA data do sistema. Tudo o que aparece nos materiais — "Agosto de
# 2026", "ago/26", "Data base: 31/08/2026", o nome dos PDFs, os cards da
# Central, a aba de edição ativa — é derivado daqui.
#
# data_base vazia = usa o último mês fechado disponível na planilha.
# ============================================================================

data_base:            # ex.: 2026-08-31   (vazio = último mês fechado)

# ---------------------------------------------------------------- o que gerar
saidas:
  html: true
  pdf: true
  pptx: true
  destaques: true     # JPG + pacote PDF dos carrosséis em saida/_Historico/AAAA-MM/destaques/<vertical>/
  emails: true        # PNG dos cards + HTML de disparo em saida/_Historico/AAAA-MM/emails/<versao>/
  atual: true         # monta saida/_Atual/ por área, com nome fixo (a edição completa fica em saida/_Historico/AAAA-MM/)
  decks: true         # decks comerciais (PPTX + PDF) em saida/_Historico/AAAA-MM/decks/ (configs/decks.yml)
  informativos: true  # Informativo HGD30/HYD60 (PPTX + PDF) em saida/_Historico/AAAA-MM/informativos/

# materiais desta edição; false desliga sem mexer em código
materiais:
  relatorio_gestao: true          # produto principal — um relatório por fundo
  post_credito_estruturado: true
  post_credito_privado: true
  post_investment_solutions: true
  email_fundos_credito: true
  central: true
  email_nordea: false             # não é mensal
  one_pager: false                # schema próprio, fora da base mensal

# ------------------------------------------------------------------- entradas
entradas:
  dados: entrada/dados_mensais.xlsx
  taxas: entrada/taxas_global.xlsx
  # .docx, .md ou .xlsx — e mais de um: o primeiro que define um fundo vence.
  # O .md é a fonte principal (convertido do documento do gestor, com todos os
  # fundos, inclusive os ALT); o .docx ao lado só cobre o que o .md não tiver.
  comentarios:
    - entrada/comentarios.md
    - entrada/comentarios.docx
  spreads: entrada/tabela_spreads.xlsx       # Mercado de Crédito (tabela setorial)
  manual: entrada/preenchimento_manual.xlsx  # overrides e, se não houver spreads,
                                             # a aba Mercado_Credito digitada

# ------------------------------------------------------------------ governança
# para em vez de publicar quando a conferência acha problema grave
parar_em_erro: true
